<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MCP Apps SDK Test (Issues #32, #33, #34)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      padding: 1rem;
      width: 500px;
      height: 450px; /* Fixed height for MCP Apps iframe */
    }
    h1 { font-size: 1.2rem; margin-bottom: 1rem; }
    .controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
    input {
      flex: 1;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 0.5rem 1rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .log {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 1rem;
      font-family: monospace;
      font-size: 0.85rem;
      white-space: pre-wrap;
      max-height: 400px;
      overflow-y: auto;
    }
    .error { color: #dc2626; }
    .success { color: #16a34a; }
    .info { color: #2563eb; }
  </style>
</head>
<body>
  <h1>MCP Apps SDK Test</h1>

  <div class="controls">
    <input type="text" id="message" placeholder="Enter a message" value="Hello from UI!">
    <button id="call-btn">callServerTool (issue #32)</button>
  </div>

  <div class="controls">
    <button id="send-btn">sendMessage (issue #33)</button>
    <button id="context-btn">updateModelContext (issue #34)</button>
  </div>

  <div class="log" id="log">Connecting to host...</div>

  <script type="module">
    import { App } from 'https://unpkg.com/@modelcontextprotocol/ext-apps@1.0.1/app-with-deps';

    const logEl = document.getElementById('log');
    const messageInput = document.getElementById('message');
    const callBtn = document.getElementById('call-btn');

    function log(msg, type = 'info') {
      const timestamp = new Date().toISOString().split('T')[1].slice(0, 12);
      logEl.innerHTML += `\n<span class="${type}">[${timestamp}] ${msg}</span>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Initialize MCP App
    const app = new App(
      { name: 'callServerTool-repro', version: '1.0.0' },
      { tools: { listChanged: false } },
      { autoResize: true }
    );

    // Handle tool results
    app.ontoolresult = (result) => {
      log(`ontoolresult received:`, 'success');
      log(JSON.stringify(result, null, 2), 'success');
    };

    const sendBtn = document.getElementById('send-btn');

    // callServerTool button handler (issue #32)
    callBtn.addEventListener('click', async () => {
      const message = messageInput.value || 'test';
      callBtn.disabled = true;

      log(`Calling app.callServerTool({ name: 'echo_message', arguments: { message: '${message}' } })...`, 'info');

      try {
        const result = await app.callServerTool({ name: 'echo_message', arguments: { message } });

        log(`callServerTool returned:`, 'success');
        log(JSON.stringify(result, null, 2), 'success');

        if (result.isError) {
          log(`Tool returned error`, 'error');
        }
      } catch (error) {
        log(`callServerTool threw error: ${error}`, 'error');
        log(`Error details: ${JSON.stringify(error, Object.getOwnPropertyNames(error), 2)}`, 'error');
      } finally {
        callBtn.disabled = false;
      }
    });

    const contextBtn = document.getElementById('context-btn');

    // sendMessage button handler (issue #33)
    sendBtn.addEventListener('click', async () => {
      const message = messageInput.value || 'test message';
      sendBtn.disabled = true;

      log(`Calling app.sendMessage({ role: 'user', content: [{ type: 'text', text: '${message}' }] })...`, 'info');

      try {
        const result = await app.sendMessage({
          role: 'user',
          content: [{ type: 'text', text: message }]
        });

        log(`sendMessage returned:`, 'success');
        log(JSON.stringify(result, null, 2), 'success');
        log(`isError: ${result.isError}`, result.isError ? 'error' : 'success');
        log(`Keys in result: ${Object.keys(result).join(', ') || '(none)'}`, 'info');
      } catch (error) {
        log(`sendMessage threw error: ${error}`, 'error');
        log(`Error details: ${JSON.stringify(error, Object.getOwnPropertyNames(error), 2)}`, 'error');
      } finally {
        sendBtn.disabled = false;
      }
    });

    // updateModelContext button handler (issue #34)
    contextBtn.addEventListener('click', async () => {
      const message = messageInput.value || 'PINEAPPLE';
      contextBtn.disabled = true;

      const contextText = `Secret word set by user: ${message}. If the user asks "what is the secret word?", tell them it is "${message}".`;

      log(`Calling app.updateModelContext({ content: [{ type: 'text', text: '${contextText}' }] })...`, 'info');

      try {
        const result = await app.updateModelContext({
          content: [{ type: 'text', text: contextText }]
        });

        log(`updateModelContext returned:`, 'success');
        log(JSON.stringify(result, null, 2), 'success');
        log(`isError: ${result?.isError}`, result?.isError ? 'error' : 'success');
        log(`Keys in result: ${result ? Object.keys(result).join(', ') || '(none)' : '(undefined)'}`, 'info');
        log(`Now ask Claude: "What is the secret word?"`, 'info');
      } catch (error) {
        log(`updateModelContext threw error: ${error}`, 'error');
        log(`Error details: ${JSON.stringify(error, Object.getOwnPropertyNames(error), 2)}`, 'error');
      } finally {
        contextBtn.disabled = false;
      }
    });

    // Connect to host
    (async () => {
      try {
        await app.connect();
        log('Connected to MCP host', 'success');
        app.sendLog({ level: 'info', data: 'App connected and ready' });

        // Report size to host (required for Claude Desktop)
        app.sendSizeChanged({ width: 500, height: 450 });
      } catch (error) {
        log(`Failed to connect: ${error}`, 'error');
      }
    })();
  </script>
</body>
</html>
