name: Release skill assets

# The README links both bundles through /releases/latest/download/, which 404s
# as soon as the newest release lacks one of them.
on:
  release:
    types: [published]

permissions:
  contents: write

defaults:
  run:
    working-directory: globalise-mcp-server

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: globalise-mcp-server/.nvmrc
      - name: Tagged bundles match the tagged skill folder
        run: node scripts/build-skill.mjs --check
      # --clobber: a release may already carry a hand-attached .skill.
      - name: Upload .skill and .zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" \
            skill/globalise-voc-research.skill \
            skill/globalise-voc-research.zip
