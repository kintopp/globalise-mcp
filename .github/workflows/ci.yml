name: CI

# The npm project lives in globalise-mcp-server/ (the git root is the parent
# monorepo dir), hence the working-directory default and cache path below.
on:
  push:
    branches: [main]
  pull_request:

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

defaults:
  run:
    working-directory: globalise-mcp-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # test:version-sync compares package.json with the newest v* tag.
          # The default depth-1 checkout fetches no tags, and fetch-tags: true
          # does not change that; only a full fetch does.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: globalise-mcp-server/.nvmrc
          cache: npm
          cache-dependency-path: globalise-mcp-server/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Full build first: the offline test chain needs its outputs — dist/ for
      # test:smoke (stdio handshake against the built server) and the local
      # SQLite DBs, which ensure:db decompresses from the committed data/*.gz
      # (no network).
      - run: npm run build
      # Offline only. The network-backed suites (test:live, test:cli) are
      # deliberately NOT run here: they hit the HuC/Gloccoli production API,
      # which is known to auto-block IPs it dislikes — hammering it from
      # GitHub's shared runners risks getting Actions egress ranges banned and
      # adds flakiness CI can't fix. The compensating habit is `npm run
      # test:live` locally before releases (see CLAUDE.md "Pre-push testing");
      # remember a push to main auto-deploys to Railway prod, so this workflow
      # gates the merge, not the deploy.
      - run: npm test
      # Prove the Claude Desktop bundle still packs (manifest validity +
      # staging), so a packaging break surfaces here, not on release day.
      - run: npm run build:mcpb
      # Launch the staged bundle the way Claude Desktop does: handshake, tool
      # parity with manifest.json, and a first-run index download from a
      # localhost server (no network).
      - run: npm run test:mcpb
      # The committed .gz must be what data/sources/ builds; a source edit
      # without a rebuild would otherwise auto-deploy. Compares decompressed
      # bytes (gzip headers record the writing OS), ignoring header bytes
      # 97-100: the version number of the SQLite library that wrote the file.
      # Non-blocking until it has passed on a Linux runner.
      - name: Committed DB artifacts match their sources
        continue-on-error: true
        run: |
          for f in archival-index reference; do gunzip -c data/$f.sqlite.gz > /tmp/$f.before; done
          npm run build:db && npm run build:db:commodities
          for f in archival-index reference; do
            gunzip -c data/$f.sqlite.gz > /tmp/$f.after
            cmp -s -n 96 /tmp/$f.before /tmp/$f.after && cmp -s -i 100 /tmp/$f.before /tmp/$f.after || {
              echo "::error::data/$f.sqlite.gz differs from a rebuild of data/sources — rebuild and commit"; exit 1
            }
          done
